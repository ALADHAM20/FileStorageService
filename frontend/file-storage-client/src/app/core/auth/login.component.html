<section class="login-page">
  <div class="login-copy">
    <p class="eyebrow">Angular 17 client</p>
    <h1>File Storage Service</h1>
    <p>
      Sign in with a mock token, then upload, preview, download, and manage files through the secured API.
    </p>
  </div>

  <div class="login-panel">
    <p class="eyebrow">Development access</p>
    <h2>Mock JWT login</h2>
    <p class="intro">Create a mock JWT to test the API as a normal user or admin.</p>

    <form [formGroup]="form" (ngSubmit)="login()" class="login-form">
      <label>
        User ID
        <input type="text" formControlName="userId" autocomplete="off" />
      </label>

      <label>
        Role
        <select formControlName="role">
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
      </label>

      @if (errorMessage) {
        <p class="error">{{ errorMessage }}</p>
      }

      <button type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Creating token...' : 'Create token' }}
      </button>
    </form>
  </div>
</section>
