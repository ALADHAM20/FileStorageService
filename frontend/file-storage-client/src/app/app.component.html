<header class="app-header">
  <a class="brand" routerLink="/storage/files">
    <span class="brand-mark">FS</span>
    <span>File Storage Service</span>
  </a>

  <nav class="nav-links" aria-label="Primary navigation">
    <a routerLink="/login" routerLinkActive="active">Login</a>
    <a routerLink="/storage/files" routerLinkActive="active">Files</a>
    <a routerLink="/storage/upload" routerLinkActive="active">Upload</a>
    @if (authService.role === 'admin') {
      <a routerLink="/storage/audit-logs" routerLinkActive="active">Audit</a>
    }
  </nav>

  <div class="session">
    @if (authService.isLoggedIn) {
      <span>{{ authService.userId }} / {{ authService.role }}</span>
      <button type="button" (click)="logout()">Logout</button>
    } @else {
      <span>Not signed in</span>
    }
  </div>
</header>

<app-toast-container />

<main class="app-main">
  <router-outlet />
</main>
